name: CI

# Guards the project's core invariant: no type drift across the Tauri boundary
# and no silent breakage. Runs on every push to the long-lived branches and on
# every PR. See ARCHITECTURE.md §3.6 (single IPC contract) and docs/PROJECT_GUIDE.md.

on:
  push:
    branches: [main, develop]
  pull_request:

# A newer push to the same ref cancels the in-flight run for that ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust - test + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # src-tauri (faforever-rust-client) links against the system webview stack,
      # so the workspace build needs these even though the logic crates are pure.
      - name: Install Tauri system dependencies
        run: |
          # The runner image ships apt sources for Chrome and Microsoft that
          # nothing here installs from, and `apt-get update` fails the whole
          # step when one of them serves a stale index: on 2026-09-09 every
          # Rust job died in twelve seconds on a "Hash Sum mismatch" from
          # dl.google.com. Those sources are dropped first, by content rather
          # than by filename, since the image spells them differently from one
          # release to the next.
          sudo grep -rlE 'dl[.]google[.]com|packages[.]microsoft[.]com' /etc/apt/sources.list.d 2>/dev/null | xargs -r sudo rm -f
          # And a refresh that still cannot reach something is not this build's
          # problem to fail on: the install below is strict, so a package that
          # genuinely did not arrive still stops the job, with a message that
          # names it.
          sudo apt-get update || true
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libssl-dev \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        # Covers every workspace crate/all target and parses Rust, unlike the
        # old grep (which missed crates and matched comments).
        run: cargo clippy --workspace --all-targets -- -D warnings -D clippy::print_stderr

  # Advisories and licences. Its own job because it needs no system libraries
  # and no build of the workspace: both tools read Cargo.lock. Kept out of the
  # Rust job so a new advisory does not look like a broken test.
  supply-chain:
    name: Dependencies - advisories + licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny

      # Fails on vulnerabilities; unmaintained and unsound crates are printed
      # without failing. That is the default and it is the right split here:
      # this tree carries a few of the latter through Tauri with no successor
      # to move to, and a gate nobody can pass gets switched off rather than
      # fixed.
      #
      # The two ignores are quick-xml, reached only through
      # `plist -> tauri-utils -> tauri-build`: a build dependency, not
      # something the shipped client links or runs, and pinned there by
      # plist's own requirement until Tauri moves. Revisit when it does.
      - name: cargo audit
        run: cargo audit --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

      # The policy is in deny.toml. Without one, `check licenses` fails on
      # every crate in the tree, which is why this was never run before.
      - name: cargo deny
        run: cargo deny check licenses bans sources

  # The upstream `commit-authors` job (scripts/check-commit-authors.mjs) is
  # left out of this fork: its macOS work is written with an AI assistant and
  # says so in the commits, which is what that job refuses.

  frontend:
    name: Frontend - lint + typecheck + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Architecture boundaries
        run: pnpm run architecture

      # Every user-visible string goes through the i18n catalogue. The scanner
      # lists any literal that still reads like copy; the budget is zero, so a
      # hardcoded string fails the build instead of shipping untranslatable.
      - name: No hardcoded user-facing strings
        run: pnpm run i18n:check --list --max 0

      - name: No em dashes in source or project documentation
        run: |
          hits=$(grep -rnP '\x{2014}' crates ui/src src-tauri/src docs .github --include='*' || true)
          if [ -n "$hits" ]; then
            echo "::error::Em dashes are forbidden: see docs/PROJECT_GUIDE.md section 8. Use punctuation appropriate to the sentence:"
            echo "$hits"
            exit 1
          fi

      - name: tsc --noEmit
        run: pnpm run typecheck

      - name: ESLint
        run: pnpm run lint

      - name: vitest
        run: pnpm test

      - name: vite build
        run: pnpm run build

      # Tokens-only guardrail: components reference semantic tokens, never raw
      # hex. Theming lives in tokens.css alone, so a new theme never revisits a
      # component. Dependency-free analogue of the bindings-drift gate.
      - name: No hardcoded colors outside tokens.css
        run: |
          hits=$(grep -rnE '#[0-9a-fA-F]{3,8}\b' ui/src --include='*.css' | grep -v 'design-system/tokens.css' || true)
          if [ -n "$hits" ]; then
            echo "::error::Hardcoded hex colors found outside tokens.css. Use a CSS variable:"
            echo "$hits"
            exit 1
          fi

  bindings-drift:
    name: Bindings drift check
    runs-on: ubuntu-latest
    # faf-ipc depends only on faf-domain + specta (no Tauri), so this job needs
    # no system libraries. It just regenerates the bindings and diffs them.
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Regenerate TypeScript bindings
        run: cargo run -q -p faf-ipc --bin export-bindings

      - name: Fail if bindings are out of date
        run: |
          if ! git diff --exit-code ui/src/ipc/bindings.ts; then
            echo "::error file=ui/src/ipc/bindings.ts::Bindings are out of date. Run 'pnpm run bindings' and commit the result."
            exit 1
          fi

  reducer-conformance-drift:
    name: Reducer conformance fixture drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # Both fixtures come out of the same test run: the case fixture and the
      # ordering fixture built from it. The frontend job reads them as checked
      # in, so either one going stale would leave the TypeScript twins tested
      # against expectations Rust no longer has.
      - name: Regenerate reducer conformance fixtures
        run: |
          for fixture in reducer-conformance.json reducer-conformance-orderings.json; do
            if ! git ls-files --error-unmatch "ui/src/store/__fixtures__/$fixture" >/dev/null; then
              echo "::error file=ui/src/store/__fixtures__/$fixture::Reducer conformance fixture is not tracked. Add it before relying on this job."
              exit 1
            fi
          done
          cargo test -p faf-domain --test conformance_fixtures

      # `--stat` rather than the diff itself: the ordering fixture is one
      # compact line of a few megabytes, and printing it helps nobody.
      - name: Fail if a fixture is out of date
        run: |
          stale=0
          for fixture in reducer-conformance.json reducer-conformance-orderings.json; do
            path="ui/src/store/__fixtures__/$fixture"
            if ! git diff --quiet -- "$path"; then
              git diff --stat -- "$path"
              echo "::error file=$path::Reducer conformance fixture is out of date. Run 'cargo test -p faf-domain --test conformance_fixtures' and commit the result."
              stale=1
            fi
          done
          exit $stale
